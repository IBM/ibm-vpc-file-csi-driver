# Deployment — Application using an NFS subdirectory PVC on IBM VPC File Storage
#
# Uses the PVC from 02-pvc-nfs-subdir.yaml.
# Both replicas share the same ReadWriteMany subdirectory.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-subdir-app
  namespace: default
  labels:
    app: nfs-subdir-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nfs-subdir-app
  template:
    metadata:
      labels:
        app: nfs-subdir-app
    spec:
      containers:
        - name: app
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: my-nfs-subdir-pvc
