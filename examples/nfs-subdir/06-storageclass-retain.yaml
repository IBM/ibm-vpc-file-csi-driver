apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: vpc-file-nfs-subdir-retain
provisioner: nfs.csi.k8s.io
parameters:
  server: "<NFS_SERVER_IP>"       # ← replace with mount target VNI IP from Step 3
  share: "<NFS_EXPORT_PATH>"      # ← replace with NFS export path from Step 3
  subDir: "${pvc.metadata.namespace}/${pvc.metadata.name}"  # namespace/pvcname avoids cross-namespace collisions
  onDelete: "retain"
  mountPermissions: "0755"
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: false
mountOptions:
  - nfsvers=4.1
  - hard
  - sec=sys
