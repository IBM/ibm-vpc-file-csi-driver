apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: vpc-file-nfs-subdir-archive
provisioner: nfs.csi.k8s.io
parameters:
  server: "<NFS_SERVER_IP>"       # ← replace with mount target VNI IP from Step 3
  share: "<NFS_EXPORT_PATH>"      # ← replace with NFS export path from Step 3
  subDir: "${pvc.metadata.name}"
  onDelete: "archive"             # subdir renamed to archived-<pvcname> on PVC deletion
  mountPermissions: "0777"        # required — IBM VPC File root_squash maps uid=0→nobody
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: false
mountOptions:
  - nfsvers=4.1
  - hard
  - sec=sys
