apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: nfs-snapclass
driver: nfs.csi.k8s.io
deletionPolicy: Delete
parameters:
  server: "<NFS_SERVER_IP>"       # ← replace with mount target VNI IP from Step 3
  share: "<NFS_EXPORT_PATH>"      # ← replace with NFS export path from Step 3
