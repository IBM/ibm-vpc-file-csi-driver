apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: vpc-file-nfs-subdir-wffc
provisioner: nfs.csi.k8s.io
parameters:
  server: "<NFS_SERVER_IP>"       # ← replace with mount target VNI IP from Step 3
  share: "<NFS_EXPORT_PATH>"      # ← replace with NFS export path from Step 3
  subDir: "${pvc.metadata.name}"
  onDelete: "retain"
  mountPermissions: "0777"
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer  # PVC stays Pending until a pod is scheduled;
                                         # binding is deferred to respect pod topology constraints
allowVolumeExpansion: false
mountOptions:
  - nfsvers=4.1
  - hard
  - sec=sys
